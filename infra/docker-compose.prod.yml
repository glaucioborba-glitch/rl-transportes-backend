version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rl_transportes}
      POSTGRES_USER: ${DB_USER:-rl}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatório}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rl} -d ${DB_NAME:-rl_transportes}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rl-network

  redis:
    image: redis:7-alpine
    container_name: rl-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rl-network

  minio:
    image: minio/minio:latest
    container_name: rl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || wget -q -O- http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rl-network

  minio-init:
    image: minio/mc:latest
    container_name: rl-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb local/$${AWS_S3_BUCKET:-rl-transportes} --ignore-existing;
      mc anonymous set download local/$${AWS_S3_BUCKET:-rl-transportes};
      echo 'Bucket criado com sucesso';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-rl-transportes}
    networks:
      - rl-network

  backend:
    build:
      context: ../apps/backend
      dockerfile: ../../infra/dockerfiles/Dockerfile.backend
    container_name: rl-backend
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      DEPLOY_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-rl}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-rl_transportes}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - rl-network

  frontend:
    build:
      context: ../apps/web
      dockerfile: ../../infra/dockerfiles/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://rl.seudominio.com.br}
    container_name: rl-frontend
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://rl.seudominio.com.br}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - rl-network

  nginx:
    image: nginx:alpine
    container_name: rl-nginx
    restart: unless-stopped
    environment:
      SSL_DOMAIN: ${SSL_DOMAIN:-rl.seudominio.com.br}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - rl-network

  certbot:
    image: certbot/certbot:latest
    container_name: rl-certbot
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done;
      "
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - nginx
    networks:
      - rl-network

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  certbot_www:
    driver: local
  certbot_conf:
    driver: local

networks:
  rl-network:
    driver: bridge
