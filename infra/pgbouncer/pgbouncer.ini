[databases]
; Host interno Docker: serviço postgres:5432. Em bare-metal, ajuste host/port.
rl = host=postgres port=5432 dbname=rl

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Pool configuration (transaction mode — compatível com Prisma)
pool_mode = transaction
max_client_conn = 200
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 50
server_idle_timeout = 300
server_lifetime = 3600
query_wait_timeout = 30

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
admin_users = rl_admin
