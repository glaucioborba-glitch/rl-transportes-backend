services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 no host evita conflito com PostgreSQL instalado localmente na 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data: